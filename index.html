      body { font-family: 'Sarabun', sans-serif; }
      #error-display { display: none; padding: 20px; background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; margin: 20px; border-radius: 8px; font-family: monospace; }
    </style>
    <!-- Global Error Handler: Shows error on screen if app crashes -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var display = document.getElementById('error-display');
        if(display) {
          display.style.display = 'block';
          display.innerHTML = '<strong>System Error:</strong><br>' + msg + '<br><small>' + url + ':' + line + '</small>';
        }
        return false;
      };
    </script>
